name: Deploy AI Workers to Snowflake

on:
  push:
    branches:
      - main
    paths:
      - 'ai/**'
      - '.github/workflows/deploy-ai-workers.yml'

# ─────────────────────────────────────────────────────────────────────────────
# CONST N — number of AI worker instances to deploy on Snowflake SPCS
# Change N to scale up/down the number of running worker containers.
# ─────────────────────────────────────────────────────────────────────────────
env:
  N: 3
  SERVICE_NAME: "AI_WORKER_SERVICE"
  COMPUTE_POOL: "AI_COMPUTE_POOL"
  IMAGE_REPO: "AI_WORKER_REPO"
  IMAGE_TAG: "latest"

jobs:
  deploy-workers:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Write Snowflake CLI config (key-pair auth) ─────────────────────────
      #    Local dev uses SNOWFLAKE_PRIVATE_KEY_PATH (a .pem file).
      #    In CI, store the raw PEM content in the SNOWFLAKE_PRIVATE_KEY secret.
      - name: Write Snowflake CLI config
        run: |
          mkdir -p ~/.snowflake

          cat > ~/.snowflake/config.toml << TOML
          [connections.default]
          account          = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user             = "${{ secrets.SNOWFLAKE_USER }}"
          warehouse        = "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          database         = "${{ secrets.SNOWFLAKE_DATABASE }}"
          schema           = "${{ secrets.SNOWFLAKE_SCHEMA }}"
          authenticator    = "SNOWFLAKE_JWT"
          private_key_path = "${{ github.workspace }}/ai/certs/key.pem"
          TOML
          chmod 0600 ~/.snowflake/config.toml
          chmod 0600 "${{ github.workspace }}/ai/certs/key.pem"

      # ── 3. Install Snowflake CLI ──────────────────────────────────────────────
      - name: Setup Snowflake CLI
        uses: Snowflake-Labs/snowflake-cli-action@v2
        with:
          default-config-file-path: "~/.snowflake/config.toml"

      # ── 4. Verify connection ──────────────────────────────────────────────────
      - name: Test Snowflake connection
        run: snow connection test --connection default

      # ── 5. Build & Push Docker image to Snowflake Image Registry ─────────────
      #    Registry URL is fetched dynamically via snow CLI — no extra secret needed.
      #    Full image path: <registry>/<database>/<schema>/<repo>/ai_worker:<tag>
      - name: Get Snowflake Image Registry URL
        run: |
          REGISTRY=$(snow spcs image-registry url --connection default)
          echo "REGISTRY=${REGISTRY}" >> $GITHUB_ENV
          # Docker requires all-lowercase image paths — lowercase everything
          RAW_PATH="${REGISTRY}/${{ secrets.SNOWFLAKE_DATABASE }}/${{ secrets.SNOWFLAKE_SCHEMA }}/${{ env.IMAGE_REPO }}/ai_worker:${{ env.IMAGE_TAG }}"
          IMAGE_PATH=$(echo "${RAW_PATH}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PATH=${IMAGE_PATH}" >> $GITHUB_ENV
          echo "Registry: ${REGISTRY}"
          echo "Image path: ${IMAGE_PATH}"

      - name: Create image repository (if not exists)
        run: |
          echo "Ensuring image repository '${{ env.IMAGE_REPO }}' exists..."
          snow spcs image-repository create "${{ env.IMAGE_REPO }}" \
            --connection default \
            --if-not-exists

      - name: Build and Push Docker image
        run: |
          echo "Building Docker image..."
          docker build -t "${IMAGE_PATH}" ./ai

          echo "Logging into Snowflake Image Registry..."
          snow spcs image-registry login --connection default

          echo "Pushing image..."
          docker push "${IMAGE_PATH}"

      # ── 6. Stop existing service ──────────────────────────────────────────────
      - name: Stop existing workers (Suspend)
        run: |
          echo "Suspending service if it exists..."
          snow sql \
            --query "ALTER SERVICE IF EXISTS ${{ env.SERVICE_NAME }} SUSPEND;" \
            --connection default || true

      # ── 7. Delete existing service ────────────────────────────────────────────
      - name: Delete existing workers (Drop)
        run: |
          echo "Dropping service if it exists..."
          snow sql \
            --query "DROP SERVICE IF EXISTS ${{ env.SERVICE_NAME }};" \
            --connection default || true

      # ── 8. Write SPCS spec YAML (avoids inline $$ shell-escaping issues) ──────
      - name: Write SPCS service spec
        run: |
          cat > /tmp/ai_worker_spec.yaml << SPEC
          spec:
            containers:
              - name: ai-worker
                image: "${IMAGE_PATH}"
                env:
                  AGENT_MEMORY:                   "${{ secrets.AGENT_MEMORY }}"
                  ENABLE_AGENT_DATA_RESTRICTIONS: "${{ secrets.ENABLE_AGENT_DATA_RESTRICTIONS }}"
                  ENABLE_TEXT_FORMAT:             "${{ secrets.ENABLE_TEXT_FORMAT }}"
                  POSTGRES_DB:                    "${{ secrets.POSTGRES_DB }}"
                  POSTGRES_HOST:                  "${{ secrets.POSTGRES_HOST }}"
                  POSTGRES_PASSWORD:              "${{ secrets.POSTGRES_PASSWORD }}"
                  POSTGRES_PORT:                  "${{ secrets.POSTGRES_PORT }}"
                  POSTGRES_USER:                  "${{ secrets.POSTGRES_USER }}"
                  REDIS_CONSUMER_GROUP:           "${{ secrets.REDIS_CONSUMER_GROUP }}"
                  REDIS_URL:                      "${{ secrets.REDIS_URL }}"
                  SNOWFLAKE_ACCOUNT:              "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                  SNOWFLAKE_DATABASE:             "${{ secrets.SNOWFLAKE_DATABASE }}"
                  SNOWFLAKE_ROLE:                 "${{ secrets.SNOWFLAKE_ROLE }}"
                  SNOWFLAKE_SCHEMA:               "${{ secrets.SNOWFLAKE_SCHEMA }}"
                  SNOWFLAKE_USER:                 "${{ secrets.SNOWFLAKE_USER }}"
                  SNOWFLAKE_WAREHOUSE:            "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
                  SNOWFLAKE_PRIVATE_KEY_PATH:     "/app/ai/certs/key.pem"
          SPEC

      # ── 9. Redeploy N workers ─────────────────────────────────────────────────
      - name: Redeploy ${{ env.N }} workers on Snowflake SPCS
        run: |
          echo "Creating SPCS service with ${{ env.N }} instance(s)..."
          snow spcs service create "${{ env.SERVICE_NAME }}" \
            --compute-pool "${{ env.COMPUTE_POOL }}" \
            --spec-path /tmp/ai_worker_spec.yaml \
            --min-instances ${{ env.N }} \
            --max-instances ${{ env.N }} \
            --connection default

          echo "Successfully deployed ${{ env.N }} AI worker(s) on Snowflake SPCS!"

      # ── 10. Wait for READY ────────────────────────────────────────────────────
      - name: Wait for service to be READY
        run: |
          echo "Waiting for service to reach READY state (max 5 min / 20 attempts)..."
          for i in $(seq 1 20); do
            STATUS=$(snow spcs service status "${{ env.SERVICE_NAME }}" \
              --connection default \
              --format json 2>/dev/null \
              | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d[0].get('status', 'UNKNOWN'))
          except Exception:
              print('UNKNOWN')
          " 2>/dev/null || echo "UNKNOWN")

            echo "  Attempt ${i}/20 — current status: ${STATUS}"

            if [ "$STATUS" = "READY" ]; then
              echo "Service is READY! All ${{ env.N }} worker(s) are live."
              exit 0
            fi
            sleep 15
          done

          echo "Service did not reach READY within 5 minutes. Dumping logs..."
          snow spcs service logs "${{ env.SERVICE_NAME }}" --connection default || true
          exit 1
